<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFBF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Write what you study as outline trees, then recall them from the top"
    />
    <script>
      // Apply a forced theme before the first paint, so a dark page never flashes white. See src/ui/theme.ts
      try {
        var theme = localStorage.getItem('kozo:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <title>Outline Recall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
